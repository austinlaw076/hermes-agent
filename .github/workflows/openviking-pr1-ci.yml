name: OpenViking PR1 Validation

on:
  pull_request:
    branches:
      - dev/openviking-pr1-base
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-integration-patch:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/openviking-stable-memory-mirror'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/openviking-stable-memory-mirror
          fetch-depth: 0
      - name: Patch OpenViking provider integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('plugins/memory/openviking/__init__.py')
          text = path.read_text(encoding='utf-8')

          old_memory_write = '''    def on_memory_write(
              self,
              action: str,
              target: str,
              content: str,
              metadata: Optional[Dict[str, Any]] = None,
          ) -> None:
              """Mirror successful built-in memory additions to OpenViking."""
              if action != "add" or not content or not self._ensure_client():
                  return

              subdir = _MEMORY_WRITE_TARGET_SUBDIR_MAP.get(target, _DEFAULT_MEMORY_SUBDIR)
              uri = self._build_memory_uri(subdir)

              def _write():
                  try:
                      client = self._new_client()
                      client.post("/api/v1/content/write", {
                          "uri": uri,
                          "content": content,
                          "mode": "create",
                      })
                  except Exception as e:
                      logger.debug("OpenViking memory mirror failed: %s", e)
                  finally:
                      with self._memory_write_lock:
                          self._memory_write_threads.discard(threading.current_thread())

              t = threading.Thread(target=_write, daemon=True, name="openviking-memwrite")
              with self._memory_write_lock:
                  if self._shutting_down:
                      return
                  self._memory_write_threads.add(t)
                  try:
                      t.start()
                  except Exception as e:
                      self._memory_write_threads.discard(t)
                      logger.debug("OpenViking memory mirror worker failed to start: %s", e)
          '''

          new_memory_write = '''    def on_memory_write(
              self,
              action: str,
              target: str,
              content: str,
              metadata: Optional[Dict[str, Any]] = None,
          ) -> None:
              """Mirror successful built-in memory mutations to OpenViking."""
              if action not in {"add", "replace", "remove"} or not self._ensure_client():
                  return
              if action in {"add", "replace"} and not content:
                  return

              subdir = _MEMORY_WRITE_TARGET_SUBDIR_MAP.get(target, _DEFAULT_MEMORY_SUBDIR)
              from plugins.memory.openviking.native_memory_mirror import (
                  enqueue_native_memory_write,
              )

              enqueue_native_memory_write(
                  self,
                  action,
                  target,
                  content,
                  metadata=metadata,
                  subdir=subdir,
              )
          '''

          old_shutdown = '''    def shutdown(self) -> None:
              # Stop deferred finalizers from issuing new commits against a
              # torn-down client, then drain everything still in flight.
              self._shutting_down = True
              # Wait for every in-flight writer across all tracked sessions.
          '''

          new_shutdown = '''    def shutdown(self) -> None:
              # Stop deferred finalizers from issuing new commits against a
              # torn-down client, then drain everything still in flight.
              self._shutting_down = True
              from plugins.memory.openviking.native_memory_mirror import (
                  shutdown_native_memory_mirror,
              )

              shutdown_native_memory_mirror(self, timeout=5.0)
              # Wait for every in-flight writer across all tracked sessions.
          '''

          if 'enqueue_native_memory_write(' not in text:
              if text.count(old_memory_write) != 1:
                  raise SystemExit('expected on_memory_write block not found exactly once')
              text = text.replace(old_memory_write, new_memory_write)

          if 'shutdown_native_memory_mirror(self, timeout=5.0)' not in text:
              if text.count(old_shutdown) != 1:
                  raise SystemExit('expected shutdown block not found exactly once')
              text = text.replace(old_shutdown, new_shutdown)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit integration patch
        run: |
          if git diff --quiet -- plugins/memory/openviking/__init__.py; then
            echo "Integration already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/memory/openviking/__init__.py
          git commit -m "fix(openviking): wire stable native-memory mirroring"
          git push origin HEAD:fix/openviking-stable-memory-mirror

  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --extra dev
      - name: Run focused mirror regression tests
        run: uv run pytest -q tests/plugins/memory/test_openviking_memory_mirror.py
