name: OpenViking PR1 Validation

on:
  pull_request:
    branches:
      - dev/openviking-pr1-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
      - run: uv python install 3.11
      - run: uv sync --locked --python 3.11 --extra dev
      - name: Run focused mirror regression tests
        run: uv run pytest -q tests/plugins/memory/test_openviking_memory_mirror.py
