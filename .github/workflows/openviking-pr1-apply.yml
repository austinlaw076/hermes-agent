name: OpenViking PR1 Apply

on:
  push:
    branches:
      - fix/openviking-stable-memory-mirror

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/openviking-stable-memory-mirror
          fetch-depth: 0
      - name: Patch provider integration
        run: python scripts/openviking_pr1_apply.py
      - name: Commit provider integration
        run: |
          if git diff --quiet -- plugins/memory/openviking/__init__.py; then
            echo "Provider already integrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/memory/openviking/__init__.py
          git commit -m "fix(openviking): wire stable native-memory mirroring"
          git push origin HEAD:fix/openviking-stable-memory-mirror
